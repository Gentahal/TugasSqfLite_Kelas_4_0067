<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <filter id="dialogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="420" height="720" rx="16" fill="#FEF7FF" stroke="#E6E0E9" stroke-width="2"/>
  
  <!-- AppBar -->
  <text x="210" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#1D1B20" text-anchor="middle">Daftar Barang</text>

  <!-- Scrim Overlay -->
  <rect width="420" height="720" rx="16" fill="#000000" fill-opacity="0.45"/>

  <!-- AlertDialog -->
  <g filter="url(#dialogShadow)">
    <rect x="46" y="210" width="328" height="290" rx="28" fill="#ECE6F0"/>
    <text x="70" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#1D1B20">Tambah Barang</text>

    <!-- TextFormField: Nama Barang -->
    <rect x="70" y="278" width="280" height="54" rx="6" fill="none" stroke="#6750A4" stroke-width="2"/>
    <rect x="80" y="270" width="84" height="14" fill="#ECE6F0"/>
    <text x="84" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6750A4">Nama Barang</text>
    <text x="84" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1D1B20">Buku Tulis Flutter</text>

    <!-- TextFormField: Stok -->
    <rect x="70" y="348" width="280" height="54" rx="6" fill="none" stroke="#79747E" stroke-width="1.5"/>
    <rect x="80" y="340" width="34" height="14" fill="#ECE6F0"/>
    <text x="84" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#49454F">Stok</text>
    <text x="84" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1D1B20">25</text>

    <!-- Actions: Batal & Tambah -->
    <text x="235" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6750A4" text-anchor="middle">Batal</text>
    <rect x="272" y="434" width="82" height="38" rx="19" fill="#6750A4"/>
    <text x="313" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tambah</text>
  </g>
</svg>