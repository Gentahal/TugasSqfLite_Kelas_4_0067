<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <filter id="fabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- App Background (Material 3 Purple Seed Surface) -->
  <rect width="420" height="720" rx="16" fill="#FEF7FF" stroke="#E6E0E9" stroke-width="2"/>
  
  <!-- AppBar -->
  <rect x="2" y="2" width="416" height="64" rx="14" fill="#FEF7FF"/>
  <text x="210" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#1D1B20" text-anchor="middle">Daftar Barang</text>
  <!-- Refresh Icon -->
  <g transform="translate(376, 22)" fill="none" stroke="#49454F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6"/>
    <polyline points="18 2 18 7 13 7"/>
  </g>

  <!-- Empty State Message -->
  <text x="210" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#49454F" text-anchor="middle">Belum ada data barang.</text>
  <text x="210" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#49454F" text-anchor="middle">Tekan tombol + untuk menambah.</text>

  <!-- FloatingActionButton -->
  <g filter="url(#fabShadow)">
    <rect x="344" y="644" width="56" height="56" rx="16" fill="#EADDFF"/>
    <path d="M372 664v16M364 672h16" stroke="#21005D" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>