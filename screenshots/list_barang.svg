<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="fabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="420" height="720" rx="16" fill="#FEF7FF" stroke="#E6E0E9" stroke-width="2"/>
  
  <!-- AppBar -->
  <rect x="2" y="2" width="416" height="64" rx="14" fill="#FEF7FF"/>
  <text x="210" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#1D1B20" text-anchor="middle">Daftar Barang</text>
  <g transform="translate(376, 22)" fill="none" stroke="#49454F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6"/>
    <polyline points="18 2 18 7 13 7"/>
  </g>

  <!-- Card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="82" width="388" height="72" rx="12" fill="#F7F2FA"/>
    <text x="32" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#1D1B20">Mechanical Keyboard</text>
    <text x="32" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#49454F">Stok: 12</text>
    <!-- Edit icon -->
    <g transform="translate(318, 106)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </g>
    <!-- Delete icon -->
    <g transform="translate(358, 106)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </g>
  </g>

  <!-- Card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="164" width="388" height="72" rx="12" fill="#F7F2FA"/>
    <text x="32" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#1D1B20">Buku Tulis Flutter</text>
    <text x="32" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#49454F">Stok: 25</text>
    <!-- Edit icon -->
    <g transform="translate(318, 188)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </g>
    <!-- Delete icon -->
    <g transform="translate(358, 188)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </g>
  </g>

  <!-- Card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="246" width="388" height="72" rx="12" fill="#F7F2FA"/>
    <text x="32" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#1D1B20">Mouse Wireless</text>
    <text x="32" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#49454F">Stok: 8</text>
    <!-- Edit icon -->
    <g transform="translate(318, 270)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </g>
    <!-- Delete icon -->
    <g transform="translate(358, 270)" fill="none" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </g>
  </g>

  <!-- FloatingActionButton -->
  <g filter="url(#fabShadow)">
    <rect x="344" y="644" width="56" height="56" rx="16" fill="#EADDFF"/>
    <path d="M372 664v16M364 672h16" stroke="#21005D" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>